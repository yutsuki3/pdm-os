# QA Result スキーマ
# QAチームから受領した合否情報を参照するための最小構造。
# QA結果の正本はJira（QAチケットのステータスと結果記録）。
# このスキーマはその参照であり、結果そのものを保持する正本ではない。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/qa-result.schema.yaml"
title: QaResult
type: object
required: [work_item_id, outcome, result_ref]
properties:
  work_item_id:
    type: string
  outcome:
    type: string
    enum: [passed, failed]
  result_ref:
    type: string
    description: 正本であるJiraのQAチケット（課題キーまたはURL）への参照。
  completed_at:
    type: string
    format: date-time
  reported_by:
    type: string
  defects_or_findings_refs:
    type: array
    items:
      type: string
  notes:
    type: string

# 未確定事項 (TBD): JiraのQAチケットの課題タイプ・ステータス体系、
# 合格/不合格をJira上のどのフィールドで表すか、不合格時の再依頼フロー。
