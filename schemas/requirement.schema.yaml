# Requirement スキーマ
#
# templates/requirement.md を構造化した要求・要望の記録。
# Work Item はこの成果物を参照する制御レコードであり、要求原文の正本ではない。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/requirement.schema.yaml"
title: Requirement
type: object
required: [work_item_id, title, recorded_at, recorded_by, request_source, request_text]
properties:
  work_item_id:
    type: string
  title:
    type: string
  recorded_at:
    type: string
    format: date
  recorded_by:
    type: string
  request_source:
    type: object
    required: [requester, channel, notion_source_url]
    properties:
      requester:
        type: string
      channel:
        type: string
      notion_source_url:
        type: string
        description: 要求原文の正本であるNotionページのURL。原文の正本はNotion。
  request_text:
    type: string
    description: >-
      原文の転記。正本は request_source.notion_source_url であり、
      本項目はその写しにすぎない。両者が食い違う場合はNotionを優先し、食い違いを記録する。
  background_and_goal:
    type: string
  current_spec_url:
    type: string
  related_history_refs:
    type: array
    items:
      type: string
  constraints:
    type: object
    properties:
      due_date:
        type: string
        format: date
      scope:
        type: string
      out_of_scope:
        type: string
  priority:
    type: object
    description: 影響度 × 緊急度の二軸で評価する。決定者はPdM/PO。
    properties:
      impact:
        type: string
        enum: [high, medium, low]
      impact_rationale:
        type: string
      urgency:
        type: string
        enum: [high, medium, low]
      urgency_rationale:
        type: string
      overall:
        type: string
        enum: [high, medium, low]
        description: 総合優先度。二軸から総合を導く規則はTBD。

# 未確定事項 (TBD): impact / urgency を high / medium / low に振り分ける閾値、
# 二軸から overall を導く規則。
