# Wireflow スキーマ
# templates/wireflow.md に対応する画面・遷移の構造。
# ワイヤーフローの正式な成果物はFigma。本構造はFigmaの代替ではなく、
# 画面ID・遷移・分岐条件を仕様書やJiraタスクから参照可能にするための草稿である。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/wireflow.schema.yaml"
title: Wireflow
type: object
required: [specification_id, screens, transitions]
properties:
  specification_id:
    type: string
  figma_url:
    type: string
    description: 正式な成果物であるFigmaファイルのURL。未作成の場合はTBDを明示する。
  screens:
    type: array
    items:
      type: object
      required: [id, name, purpose]
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        key_elements:
          type: array
          items:
            type: string
        notes:
          type: string
  transitions:
    type: array
    items:
      type: object
      required: [from_screen_id, action, to_screen_id]
      properties:
        from_screen_id:
          type: string
        action:
          type: string
        to_screen_id:
          type: string
        condition:
          type: string
  open_questions:
    type: array
    items:
      type: string

# 未確定事項 (TBD): Figmaファイルの命名規則・格納場所、
# screens[].id とFigmaフレーム名の対応の付け方、Figma更新時に本草稿を追随させる責任者・タイミング。
