# Release Note スキーマ
# templates/release-note.md に対応する公開前草稿。
# 公開済みリリースノートの正本・アーカイブ先はNotion（docs/architecture/source-of-truth.md）。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/release-note.schema.yaml"
title: ReleaseNote
type: object
required: [release_identifier, release_date, changes]
properties:
  release_identifier:
    type: string
    description: リリース単位はバージョン番号。番号の付与規則（セマンティックバージョニング等）はTBD。
  release_date:
    type: string
    format: date
  scope_description:
    type: string
  summary:
    type: string
  changes:
    type: array
    minItems: 1
    items:
      type: object
      required: [work_item_id, summary]
      properties:
        work_item_id:
          type: string
        summary:
          type: string
        specification_url:
          type: string
        jira_issue_keys:
          type: array
          items:
            type: string
        github_refs:
          type: array
          items:
            type: string
  known_issues:
    type: array
    items:
      type: string
  rollout_plan:
    type: string
  publication:
    type: object
    description: 公開が実際に行われた場合のみ記録する。
    required: [notion_page_url]
    properties:
      notion_page_url:
        type: string
        description: 公開済みリリースノートのNotionページURL。released の公開証跡。
      published_at:
        type: string
        format: date-time
      approved_by:
        type: string

# 未確定事項 (TBD): バージョン番号の付与規則・採番主体、
# Notion上のページ構成・データベース設計、社内向け/顧客向けの出し分け。
# 公開承認者・基準は docs/architecture/approval-policy.md により確定（会議体: PdM/PO + エンジニアリード + QAリード）。
