# Jira Task Draft スキーマ
# Jira登録前の候補を表す。Jira課題そのものの正本はJira。
# 階層は「1案件 (Work Item) = 1ストーリー + 配下に複数タスク」。
# 課題タイプはJira標準を使い、デザイン／実装の区別はラベルで表す。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/jira-task.schema.yaml"
title: JiraTaskDraft
type: object
required: [draft_id, work_item_id, specification_id, title, summary, acceptance_criteria]
properties:
  draft_id:
    type: string
    minLength: 1
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
    description: >
      Jira登録前の草稿を識別するID。英数字で始め、英数字・ハイフン・アンダースコア・ドットだけを使用する。
      生成する同一タスク草稿リスト内で一意にする。採番主体・採番規則はTBD。jira_issue_keyとは区別する。
  work_item_id:
    type: string
  specification_id:
    type: string
  title:
    type: string
  issue_type:
    type: string
    description: >-
      Jira標準の課題タイプ。案件全体を表すストーリーは story、個々の作業は task。
      デザイン／実装の区別はここではなく work_category / labels_or_components で表す。
    enum: [story, task]
  work_category:
    type: string
    description: デザインか実装か。Jira上はラベルとして登録する。
    enum: [design, implementation]
  parent_story_ref:
    type: string
    description: >-
      配下タスクが属するストーリーへの参照。登録後はストーリーのJira課題キー、
      未登録の段階では work_item_id を用いる。issue_type が story の場合は指定しない。
  project_key:
    type: string
    description: Jiraプロジェクトキー。具体値はTBD。
  summary:
    type: string
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [text, trace_refs]
      properties:
        text:
          type: string
        trace_refs:
          type: array
          minItems: 1
          description: この条件の根拠への参照。要件IDだけでなくワイヤーフロー画面IDも参照できる。
          items:
            type: object
            required: [source_type, source_ref, item_ref]
            properties:
              source_type:
                type: string
                enum: [specification, wireflow, jira_task_draft, jira_issue]
              source_ref:
                type: string
                description: 仕様書ID、ワイヤーフロー参照、草稿ID、またはJira課題キー。
              item_ref:
                type: string
                description: FR-001、S2等、参照元成果物内の項目ID。
  dependency_refs:
    type: array
    items:
      type: object
      required: [target_type, target_ref]
      properties:
        target_type:
          type: string
          enum: [jira_task_draft, jira_issue]
        target_ref:
          type: string
          description: 草稿段階ではdraft_id、登録後はJira課題キーを指定する。
  estimate:
    type: string
    description: 単位・入力時点はTBD。
  labels_or_components:
    type: array
    items:
      type: string
  assignee_candidate:
    type: string
  jira_issue_key:
    type: string
    description: 登録後にJira正本を参照するためのキー。

# 未確定事項 (TBD): 草稿IDの採番規則、Jiraプロジェクトキーの具体値、必須カスタムフィールド、
# タスクの分解粒度、見積り・アサイン規則、デザイン/実装タスク間のJiraリンク種別。
