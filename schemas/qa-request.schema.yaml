# QA Request スキーマ
# templates/qa-request.md に対応する送付前の草稿。
# 送付証跡の正本はSlackの投稿（docs/architecture/source-of-truth.md）。
# 送付先チャンネル・投稿フォーマットはTBD。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "pdm-os/schemas/qa-request.schema.yaml"
title: QaRequest
type: object
required: [work_item_id, specification_id, requested_at, requested_by, scope]
properties:
  work_item_id:
    type: string
  specification_id:
    type: string
  requested_at:
    type: string
    format: date
  requested_by:
    type: string
  overview:
    type: string
  links:
    type: object
    properties:
      notion_spec_url:
        type: string
      jira_issue_keys:
        type: array
        items:
          type: string
      github_refs:
        type: array
        items:
          type: string
      acceptance_report_ref:
        type: string
  scope:
    type: object
    required: [included]
    properties:
      included:
        type: array
        items:
          type: string
      excluded:
        type: array
        items:
          type: string
  test_environment:
    type: string
  entry_criteria:
    type: array
    items:
      type: string
  exit_criteria:
    type: array
    items:
      type: string
  risks:
    type: array
    items:
      type: string
  delivery:
    type: object
    description: >-
      送付が実際に行われた場合のみ記録する。記録した場合は slack_permalink が
      qa_requested の遷移証跡となる。
    required: [slack_permalink]
    properties:
      sent_at:
        type: string
        format: date-time
      sent_by:
        type: string
      slack_permalink:
        type: string
        description: 送付証跡となるSlack投稿のパーマリンク。送付証跡の正本はSlack。
      qa_issue_key:
        type: string
        description: 結果を追うJiraのQAチケット。QA結果の正本はJira。

# 未確定事項 (TBD): 送付先Slackチャンネル・投稿フォーマット、
# Slack投稿とJiraのQAチケットの相互リンク方法、entry/exit criteria。
